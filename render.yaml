services:
  - type: web
    name: local-whatsapp
    runtime: node
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /ping
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: whatsapp-postgres
          property: connectionString
      - key: SESSION_ENCRYPTION_KEY
        generateValue: true

databases:
  - name: whatsapp-postgres
    databaseName: whatsapp_bot_db
    user: whatsapp_user
    plan: free
